[package]
name = "wuffi-tauri"
version = "1.0.0-rc.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gary0122g/wuffi"
default-run = "wuffi"

[[bin]]
name = "wuffi"
path = "src/main.rs"

# Same application, separate development binary so safety tests never replace
# or terminate a writer's running window. Excluded from ordinary builds.
[[bin]]
name = "wuffi-safety"
path = "src/main.rs"
required-features = ["safety-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["time", "sync", "fs", "macros", "process", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10.9"
chrono = "0.4"
encoding_rs = "0.8"
notify = "8.2"
percent-encoding = "2"
arboard = "3.7"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
safety-tests = []

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
